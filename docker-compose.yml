services:
  nlp:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./nlp-engine:/app
      - contexta-data:/data
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      CONTEXTA_DB_PATH: /data/contexta.sqlite3
    ports: ["8000:8000"]
  api:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./server:/app"]
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:5173
      NLP_ENGINE_URL: http://nlp:8000
    depends_on: [nlp]
    ports: ["5000:5000"]
  client:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./client:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on: [api]
    ports: ["5173:5173"]
volumes:
  contexta-data:
